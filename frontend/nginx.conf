server {
    listen 80;
    server_name localhost; # Or your specific domain

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Serve static files directly from root (e.g. /assets/*)
    # Vite places assets in /assets by default, referenced from index.html
    location /assets {
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
    }

    # Serve other static files like favicons, manifest.json etc. if they are in the root
    location ~* \.(?:map|jpe?g|png|gif|ico|cur|heic|webp|tiff?|mp3|m4a|aac|ogg|midi?|wav|mp4|mov|webm|mpe?g|avi|wmv|mkv|flv|f4v|pdf|svg|svgz|eot|otf|ttf|woff|woff2|webmanifest|xml|json)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
    }

    # For Single Page Application (SPA) routing
    # All other requests are sent to index.html for client-side routing to handle
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: Basic error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html; # Or a custom error page directory
    }

    # Optional: You might want to add security headers, gzip compression, etc. here
    # gzip on;
    # gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
